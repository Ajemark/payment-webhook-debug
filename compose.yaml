services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: odin
      POSTGRES_DB: payment_debug
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
      - ./data/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odin -d payment_debug"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  payment_data:
